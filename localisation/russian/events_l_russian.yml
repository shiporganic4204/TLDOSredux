  arabia.2.t: "Гражданкая Война Неизбежна"
  arabia.2.d: "Гражданкая Война Неизбежна"
  news.1488.d: "Запах пороха и железа окутал украинские степи и карпатские горы...Сегодня было получено известие, что Национальные Отряды Донбасса пересекли границу с Украиной и начали свой «священный очистительный поход». В столице Сталино уже начали проходить колонны из БТР, танков и САУ, а ядерные боеголовки уже навели прямо на Киев и Берлин. Не смотря на малый размер, у Донбасса огромный потенциал благодаря своей мощной армии и ядерному оружию. И поэтому, эта война может повлиять на судьбу не просто Афиосленда, но и на всю Европу в целом. Все держат руку на пульсе... Никто не знает, что может произойти в дальнейшем, ведь Новороссия в плане своих действий непредсказуема... Все надеяться на скорое окончание войны без использования ядерных ракет."
  news.1488.t: "Новороссы маршируют на запад"
  news.1488.a: "Боже спаси нас..."