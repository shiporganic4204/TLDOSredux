 LOADING_TIP_0: "«Афиосы - бессердечные создания».\n- Адольф Гитлер"
 LOADING_TIP_1: "«Найти этого ублюдка и убить».\n- Афиос Вагнер"
 LOADING_TIP_2: "«Короче говоря, Афиос - это ультрамегагигасуперпупердиктатор».\n- Афиос"
 LOADING_TIP_3: "Афиос это вечность, а вечность это Афиос"
 LOADING_TIP_4: "запись идёт...\n \n Георгий 10-й был в одно время и диктатором и хорошим правителем."
 LOADING_TIP_5: "существует культ, известный как "Секта Поносных". Их предводитель, Мистер Двушка, — таинственная фигура, обладающая способностью манипулировать сознанием своих последователей."
 LOADING_TIP_6: "Старое название Афиосленда - 𓈖𓅃 𓈖𓇋𓅓𓂋𓅲𓂧𓇋𓄿"
 LOADING_TIP_7: "«Г.О.В.Н.О.» \n- Диктато от 19.11.2024"
 LOADING_TIP_8: "В эпоху процветания были изобретены первые летающие корабли, маленькие и большие: прототип большого корабля "Виктор" и прототип маленького "Даниил"В это время Афиос не правил Афиослендом, вместо него на правительство поступил один из восставших: Георгий X. Он был ему как брат."
 LOADING_TIP_9: "«Постройте жилые модули. Для всего интерьера и экстерьера материалов хватит. По желанию, можете развести костры и пожарить шашлычки.».\n- Афиос"
 LOADING_TIP_10: "В 2041 обнаружились государства, и к несчастью, все они оказались враждебными."
 LOADING_TIP_11: "В 2045-м году создали проект "Das Kolossal". Это большой, очень хорошо бронированный корабль с кучей оружия, короче говоря, ЭТО КРЕЙСЕР!"
 LOADING_TIP_12: "Шпионы Афиосленда украли несколько чертежей "Доминатора", а потом инженеры Афиосленда поняли, что этот корабль очень огромный."
 
 
 
 

