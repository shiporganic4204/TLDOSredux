  AFI_START_DESC: "Афиосы решили соединить пол демократии и пол тоталитаризма типа, ну... Получилось вот что: Партия, которая правит Афиослендом, делает половину своей работы ТОТАЛИТАРИЗМОМ, а другую половину своей работы ДЕМОКРАТИЕЙ. Каждый день проходят выборы: Кто хочет в тоталитаризме жить сегодня, и кто в демократии. Очевидно, что большинство выберут демократию, и данные отправляются в главштаб Партии Афиосленда, и тот или иной чел теперь живет либо в тоталитаризме, либо в демократии. (сейчас ты назовёшь меня полным ебланищем)"
  LMK_START_DESC: "После исчезновения всех колоний, в Бельгии и Великобритании начались экономические кризисы, что привело к голоду и сильному недовольству этих стран. Правительство обоих государств под давлением общества объединились для решения своих проблем, первым делом они аннексировали Нидерланды, что немного улучшило ситуацию."

